services:
  history-editor:
    image: ruby:3.3.4-slim-bookworm
    container_name: history-editor-dev
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - ./db:/app/db
    working_dir: /app
    command: >
      bash -c "apt update &&
              apt install -y build-essential git libyaml-dev &&
              cd /app &&
              bundle install &&
              bundle exec rails db:migrate &&
              bundle exec rails server -b 0.0.0.0"